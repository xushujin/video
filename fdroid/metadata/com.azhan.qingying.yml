# 轻影 · F-Droid 构建配方（fdroiddata metadata）
#
# 提交方式：把本文件所在的 metadata/ 目录内容，复制到 fdroiddata 仓库的 metadata/
# 目录，**文件名必须是 com.azhan.qingying.yml**，然后向
# https://gitlab.com/fdroid/fdroiddata 提 MR。
# 放在应用仓库里只是随代码一起做版本管理；F-Droid 只读 fdroiddata 里那一份。
#
# 字段说明见 https://f-droid.org/docs/Build_Metadata_Reference/
# 本配方只用文档里有明文规定的字段，没有凭印象填的东西。

Categories:
  - Multimedia
License: Apache-2.0
AuthorName: xushujin
WebSite: https://github.com/xushujin/video
SourceCode: https://github.com/xushujin/video
IssueTracker: https://github.com/xushujin/video/issues
Changelog: https://github.com/xushujin/video/releases

AutoName: 轻影

RepoType: git
Repo: https://github.com/xushujin/video.git

# 说明：
# - Gradle 工程根就在仓库根目录（settings.gradle.kts 在根），所以不写 subdir。
# - 没有测试源集（app/src 下只有 main），因此不需要 scandelete。
# - 无签名密钥时 release 构建照常产出 APK（见 app/build.gradle.kts 的 hasReleaseSigning
#   逻辑，两条签名通道都没有时不配置签名），F-Droid 拿到后再用它自己的密钥签名。
#
# - output 这条是**必须**的：本项目用 androidComponents 把产物名改成了
#   QingYing-<versionName>-release.apk，不是默认的 app-release-unsigned.apk。
#   用 glob 是为了以后升版本号不用改配方。
#   如果 F-Droid 的 CI 报「找不到 APK」，先看这一行。
Builds:
  - versionName: '1.3.0'
    versionCode: 4
    commit: v1.3.0
    output: app/build/outputs/apk/release/QingYing-*-release.apk
    gradle:
      - yes

  - versionName: '1.2.0'
    versionCode: 3
    commit: v1.2.0
    output: app/build/outputs/apk/release/QingYing-*-release.apk
    gradle:
      - yes

  - versionName: '1.1.0'
    versionCode: 2
    commit: v1.1.0
    output: app/build/outputs/apk/release/QingYing-*-release.apk
    gradle:
      - yes

  # 历史版本条目必须保留：F-Droid 靠它复现旧包。
  - versionName: '1.0.0'
    versionCode: 1
    commit: v1.0.0
    output: app/build/outputs/apk/release/QingYing-*-release.apk
    gradle:
      - yes

# 自动跟踪新 tag：以后只要打 tag 并推送，F-Droid 就会自动检测到新版本，
# 与本项目 .github/workflows/build-apk.yml 的触发方式保持一致。
#
# UpdateCheckMode 后面可以跟一个空格分隔的正则，只认 v 开头的版本号 tag ——
# 以后打了别的 tag（如 hotfix、beta）不会被误当成新版本。
# UpdateCheckData 让 fdroidserver 直接从 app/build.gradle.kts 读
# versionCode / versionName，不必依赖它对 Gradle DSL 的自动解析。
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[\d.]+$
UpdateCheckData: app/build.gradle.kts|versionCode\s*=\s*(\d+)|.|versionName\s*=\s*"(.*)"
CurrentVersion: '1.3.0'
CurrentVersionCode: 4
